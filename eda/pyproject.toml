[project]
name = "latam-eda"
version = "0.1.0"
description = "EDA, backup-vs-main comparison and anomaly detection for the LATAM Bank dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "boto3>=1.43.107",
    "duckdb>=1.5.6",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pyod>=3.6.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "ruptures>=1.1.10",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
]
