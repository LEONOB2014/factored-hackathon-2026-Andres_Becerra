[project]
name = "latam-eda"
version = "0.1.0"
description = "EDA, backup-vs-main comparison and anomaly detection for the LATAM Bank dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "boto3>=1.43.107",
    "duckdb>=1.5.6",
    "holidays>=0.105",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "itables>=2.9.1",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "missingno>=0.5.2",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pyod>=3.6.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "ruptures>=1.1.10",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

# Linux (CI) gets the CPU-only torch build: the default CUDA wheels are several
# GB and the EDA never uses a GPU. macOS keeps the regular PyPI wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra --strict-markers -m 'not notebooks'"
markers = [
    "data: needs the downloaded dataset in the repository-level data/ (skipped when absent)",
    "slow: takes more than a few seconds",
    "notebooks: executes notebook sources end to end (opt-in, hours on the full data)",
]
