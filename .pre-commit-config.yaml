repos:
  # === Formatting & Linting ===
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # Scoped to real Python files: ruff >=0.16 also formats Python inside
      # Markdown fences, which rewrites the illustrative code in docs/specs/.
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  # === General file hygiene ===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags (dbt, Airflow)
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
        # Executed notebooks and their HTML exports carry inline charts (~1-2 MB)
        exclude: ^eda/(notebooks/.*\.ipynb|reports/notebooks/.*\.html)$
      - id: check-merge-conflict
      - id: detect-private-key
      # main and develop change only through pull requests. The repo is private on a
      # free plan, so GitHub branch protection is unavailable; this is the guard.
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]

  # === GitHub Actions ===
  # Catches invalid workflow expressions before they reach CI — a job-level
  # `if: hashFiles(...)` is rejected by GitHub and runs zero jobs.
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  # === Security ===
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # Executed notebooks and their HTML exports embed base64 chart data that trips the
        # entropy and AWS-key detectors (checked: no real credentials). Their code is still
        # scanned through the .py sources in eda/notebooks/.
        exclude: (\.lock|\.csv|\.parquet|^eda/notebooks/.*\.ipynb|^eda/reports/notebooks/.*\.html)$

  # === Type Checking ===
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.9.0, fastapi>=0.115.0]
        args: [--ignore-missing-imports]
        files: ^(backend|agents)/

  # === SQL Linting (for dbt) ===
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.2.3
    hooks:
      - id: sqlfluff-lint
        files: ^data_engineering/dbt/
        args: [--dialect, postgres]

  # === EDA workspace (eda/ is its own uv project) ===
  # The fast suite needs no dataset; the `data`/`slow` tests run with `make eda-test-data`.
  # CI skips eda-tests here and runs the suite in its own job (test-eda).
  - repo: local
    hooks:
      - id: eda-lock
        name: eda uv.lock matches pyproject
        entry: uv lock --check --directory eda
        language: system
        files: ^eda/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: eda-tests
        name: eda fast tests
        entry: uv run --directory eda pytest -q -m "not data and not slow and not notebooks"
        language: system
        files: ^(eda/|docs/dataset/)
        pass_filenames: false

  # === Commit Messages ===
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.1
    hooks:
      - id: commitizen
