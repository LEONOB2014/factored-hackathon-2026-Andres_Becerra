[project]
name = "kumo-probe"
version = "0.1.0"
description = "Evaluation-only probe of NVIDIA Kumo models against the hour-grain readiness gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Local `modal run` only. structured-data-models is not on PyPI; the GPU image
# installs it from git. CPU tests mock sdm and do not install it.
modal = ["modal>=1.0"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kumo_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["src"]
