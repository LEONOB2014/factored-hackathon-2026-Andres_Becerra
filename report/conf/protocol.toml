# The registered specification of the report, frozen at P3 before any clustered gate estimate exists.
# After the freeze every change needs an [[amendments]] entry (field, old, new, date, reason);
# tests/test_protocol.py checks this against freeze_commit. The code the specification names (latam_eda's
# readiness_verdict, paired_boot, clustered_gate and the scenarios of hour_models) is the code at freeze_commit.

[protocol]
frozen = true
freeze_commit = "b387f693b4a4fe0888db1a96ec9d11e49e39f5fe"  # pragma: allowlist secret

[dataset]
# Measured at P3 (2026-10-07): the maximum process_date of every main table, and of the backup's transactions.
end_date = "2026-06-17"
backup_transactions_end_date = "2024-09-25"
backup_missing_tables = ["satisfaction_surveys", "call_transcripts"]
# There is no untouched holdout: every notebook saw data up to end_date. Each gate keeps its own out-of-time split,
# as coded at freeze_commit ([gates.splits]); re-estimation changes only how the interval is computed.
split = "per scenario, as coded at freeze_commit"

