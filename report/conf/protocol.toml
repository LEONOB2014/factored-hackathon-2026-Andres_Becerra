[clock]
# ADR-014: each process on its delivery-day clock.
offset_hours_transactions = -6
offset_hours_digital_events = -6
offset_hours_campaign_sends = -6
offset_hours_contacts = -8
offset_hours_complaints = -8

[privacy]
# No table cell or plotted group from fewer contributors than this (eng review A2).
min_cell = 10

[intervals]
level = 0.95
# Cluster policy for claims (report_lib.estimators.intervals.ratio_by_policy): percentile cluster bootstrap from
# min_clusters clusters; CR2 and wild cluster bootstrap from min_clusters_few; below that, descriptive only.
min_clusters = 30
min_clusters_few = 10
bootstrap_draws = 2000

[gates]
# The 11 rows of latam_eda.hour_models.scorecard() (ADR-018), all of them whatever their verdict (E1).
ids = [
    "02-customer.daypart-of-the-next-transaction",
    "02-customer.dormancy-from-the-time-of-day-profile",
    "03-market-and-channel.hourly-volume-per-market-channel",
    "04-branch.branch-hour-atm-cash",
    "04-branch.teller-transaction-outside-opening-hours",
    "05-agent-and-queue.handle-time-per-agent-hour",
    "05-agent-and-queue.hourly-contact-arrivals-per-queue",
    "06-case-clock.sla-breach-at-creation",
    "06-case-clock.time-to-first-response",
    "07-session-and-send.open-within-24-h-by-send-hour",
    "07-session-and-send.session-purchase-from-the-event-sequence",
]
rule = "latam_eda.granularity.readiness_verdict, unchanged: green, amber or red from the 95 % bootstrap interval, materiality, MDE and fold signs"
estimator = "readiness_check.py --cluster: latam_eda.granularity.clustered_gate on the scenario's clustered or day-block bootstrap"
bootstrap_draws = 200
min_clusters = 30
nan_share_max = 0.05
# Constants of readiness_verdict as frozen (documented by amendment, no behavior change): the gate interval is
# the two-sided 1 - alpha bootstrap percentile interval; MDE = mde_multiplier x bootstrap SD, the multiplier being
# z(1 - alpha/2) + z(power) rounded as in the code.
alpha = 0.05
power = 0.8
mde_multiplier = 2.8
disagreement = "a re-estimated gate disagrees when its verdict or its root cause differs from the published scorecard"
datasets = ["main", "backup"]
# A gate's main and backup re-estimates differ materially when their deltas differ by more than the 95th
# percentile of the paired main-backup sampling-noise baseline of the same metric (Chapter 6, computed by rule,
# frozen here as a rule because its value needs Chapter 6's estimator); the row is then flagged copy_disagreement.
copy_tolerance = "95th percentile of the paired main-backup noise baseline of the gate's metric (Chapter 6)"

[gates.units]
"02-customer.daypart-of-the-next-transaction" = "customer (rows are customers)"
"02-customer.dormancy-from-the-time-of-day-profile" = "customer (rows are customers)"
"03-market-and-channel.hourly-volume-per-market-channel" = "day, stationary blocks (Politis-White length)"
"04-branch.branch-hour-atm-cash" = "day, stationary blocks (Politis-White length)"
"04-branch.teller-transaction-outside-opening-hours" = "branch"
"05-agent-and-queue.handle-time-per-agent-hour" = "agent"
"05-agent-and-queue.hourly-contact-arrivals-per-queue" = "day, stationary blocks (Politis-White length)"
"06-case-clock.sla-breach-at-creation" = "customer"
"06-case-clock.time-to-first-response" = "customer"
"07-session-and-send.open-within-24-h-by-send-hour" = "campaign"
"07-session-and-send.session-purchase-from-the-event-sequence" = "customer"

[gates.splits]
"02-customer.daypart-of-the-next-transaction" = "history up to end minus 90 days; label: daypart of the first transaction after it"
"02-customer.dormancy-from-the-time-of-day-profile" = "features at end minus 270 days (train) and end minus 90 days (test); label: no transaction in the next 90 days"
"03-market-and-channel.hourly-volume-per-market-channel" = "last 56 days of each market x channel series; up to 26 weeks before for training"
"04-branch.branch-hour-atm-cash" = "last 28 delivery days"
"04-branch.teller-transaction-outside-opening-hours" = "branch transactions after the 2/3 quantile of their timestamps"
"05-agent-and-queue.handle-time-per-agent-hour" = "agent-hours after the 2/3 quantile of hour_start"
"05-agent-and-queue.hourly-contact-arrivals-per-queue" = "last 56 days of each queue series with at least 1000 contacts"
"06-case-clock.sla-breach-at-creation" = "cases created after the 2/3 quantile of created_clock"
"06-case-clock.time-to-first-response" = "cases created after the 2/3 quantile of created_clock"
"07-session-and-send.open-within-24-h-by-send-hour" = "40 % hash sample of tracked, delivered sends; after the 2/3 quantile of send time"
"07-session-and-send.session-purchase-from-the-event-sequence" = "25 % hash sample of sessions; after the 2/3 quantile of session start"

# BH families (eng review R2-4): defined by source, not by citation; q is computed over every test in the family.
# Report-only estimators produce intervals, not tests; a test they add must be declared here by amendment before
# it runs.
[[families]]
id = "daily-series-i"
source = "eda/reports/tables/granularity_signal.csv"
column = "p_value"
size = 60

[[families]]
id = "daily-series-ii"
source = "eda/reports/tables/granularity_time_signal.csv"
column = "p_value"
size = 65

[[families]]
id = "hourly-series-iii"
source = "eda/reports/tables/granularity_hour_signal.csv"
column = "p_value"
size = 52

[[families]]
id = "country-calendar-main"
source = "eda/reports/tables/country_{all,ar,co,mx}_calendar_effects.csv"
column = "p_value"
size = 50

[[families]]
id = "country-calendar-backup"
source = "eda/reports/tables/backup_{all,ar,co,mx}_calendar_effects.csv"
column = "p_value"
size = 50

[disk]
# GiB. Measured at P0: one main/ALL scratch scope 3.2, the worktree's platform environment 1.7 (D22).
tex = 2
duckdb_spill = 6
build = 4
scratch_scope = 3.2
platform_env = 1.7
headroom = 5

[[amendments]]
field = "gates.alpha"
old = "(absent)"
new = 0.05
date = "2026-10-07"
reason = "documents a constant of the frozen readiness_verdict so the report can cite it; no behavior change"

[[amendments]]
field = "gates.power"
old = "(absent)"
new = 0.8
date = "2026-10-07"
reason = "documents a constant of the frozen readiness_verdict so the report can cite it; no behavior change"

[[amendments]]
field = "gates.mde_multiplier"
old = "(absent)"
new = 2.8
date = "2026-10-07"
reason = "documents a constant of the frozen readiness_verdict so the report can cite it; no behavior change"
