name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================================
  # Code Quality
  # ============================================================================
  quality:
    name: "Lint, Format & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Single source of truth: the same pinned hooks that run locally on commit.
      # Running ruff/mypy separately here let CI resolve newer versions than the
      # hooks pinned, so a clean local commit could still fail CI.
      # eda-tests needs the EDA environment; the test-eda job installs it and runs them.
      # no-commit-to-branch guards local commits; on a push to main CI checks out
      # main itself, so the hook would fail every post-merge run.
      - name: Lint, format and type check (pre-commit)
        env:
          SKIP: eda-tests,no-commit-to-branch
        run: uvx pre-commit run --all-files --show-diff-on-failure

  # ============================================================================
  # Unit Tests
  # ============================================================================
  test-unit:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run unit tests
        run: pytest backend/tests/unit agents/evals -m "unit" -v --cov=backend --cov=agents --cov-report=xml

      - name: Upload coverage
        # Reporting only: a Codecov outage must not fail the tests or block the jobs that depend on them.
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  # ============================================================================
  # EDA Tests
  # ============================================================================
  # eda/ is its own uv project (Python 3.12 from eda/.python-version, CPU-only
  # torch on Linux). The dataset is not in git, so `data` and `notebooks` tests
  # are left out here; run them locally with `make eda-test-data`.
  test-eda:
    name: "EDA Tests"
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: eda
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: eda/uv.lock

      - name: Install EDA environment
        run: uv sync --locked

      - name: Run EDA tests
        run: uv run pytest -m "not data and not notebooks" --cov=latam_eda --cov-report=term-missing

  # ============================================================================
  # Platform library tests (lossless bronze proof, PII guard, KB pipeline, ...)
  # Tests that need the local pg-core container skip themselves when it is absent.
  # ============================================================================
  test-platform:
    name: "Platform Tests"
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: platform/uv.lock

      - name: Install platform environment
        run: uv sync --locked

      - name: Run platform library tests
        run: uv run pytest libs/tests -q

  # ============================================================================
  # Integration Tests
  # ============================================================================
  test-integration:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    needs: test-unit
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: factored
          POSTGRES_PASSWORD: factored2026
          POSTGRES_DB: bankingdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U factored -d bankingdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://factored:factored2026@localhost:5432/bankingdb
          REDIS_URL: redis://localhost:6379/0
        run: |
          # No integration tests written yet; pytest exits 5 on an empty suite.
          # Delete this guard once the first one lands.
          pytest backend/tests/integration -m "integration" -v || code=$?
          if [ "${code:-0}" -eq 5 ]; then
            echo "::notice::No integration tests collected yet"
            exit 0
          fi
          exit "${code:-0}"

  # ============================================================================
  # dbt Tests
  # ============================================================================
  test-dbt:
    name: "dbt Tests"
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: factored
          POSTGRES_PASSWORD: factored2026
          POSTGRES_DB: bankingdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U factored -d bankingdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt
        run: pip install dbt-postgres

      # dbt's sources in models/staging/src_raw.yml point at raw.*, which only
      # exists once this script has run — without it every test fails with
      # 'relation "raw.<table>" does not exist'.
      - name: Create database schemas
        env:
          PGPASSWORD: factored2026
        run: psql -h localhost -U factored -d bankingdb -v ON_ERROR_STOP=1 -f scripts/init_db.sql

      - name: Run dbt tests
        working-directory: data_engineering/dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt deps
          dbt seed
          dbt run
          dbt test

  # ============================================================================
  # Agent Evaluations (CI suite - lightweight)
  # ============================================================================
  test-evals:
    name: "Agent Evaluations (CI)"
    runs-on: ubuntu-latest
    needs: test-unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Checked before installing: the dev dependency set is multi-gigabyte, and
      # there is no point unpacking it for a script that does not exist yet.
      - name: Check for eval suite
        id: suite
        run: |
          if [ -f agents/evals/evaluator.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::agents/evals/evaluator.py not written yet - skipping"
          fi

      - name: Install uv
        if: steps.suite.outputs.present == 'true'
        uses: astral-sh/setup-uv@v3

      # uv, like every other job here: plain pip filled the runner's disk
      # unpacking the same dependency set ("No space left on device").
      - name: Install dependencies
        if: steps.suite.outputs.present == 'true'
        run: uv pip install --system -e ".[dev]"

      - name: Run CI evaluation suite
        if: steps.suite.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python agents/evals/evaluator.py --suite=ci

  # ============================================================================
  # Docker Build
  # ============================================================================
  docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false
          tags: factored-banking-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Card copilot (own uv project; synthetic snapshot, no dataset, no model key)
  # ============================================================================
  test-copilot:
    name: "Copilot Tests"
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: copilot
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: copilot/uv.lock

      - name: Install copilot environment
        run: uv sync --locked

      - name: Run copilot tests
        run: uv run pytest -q

  # ============================================================================
  # BETA AID Console (TanStack Start, bun; no backend needed: fetch is mocked)
  # ============================================================================
  console:
    name: "Console"
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install console dependencies
        run: bun install --frozen-lockfile

      - name: Run console tests
        run: bun run test

      - name: Build the console
        run: bun run build
