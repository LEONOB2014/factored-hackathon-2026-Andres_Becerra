name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================================
  # Code Quality
  # ============================================================================
  quality:
    name: "Lint, Format & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check backend/ agents/ ml/ data_engineering/

      - name: Format check with Ruff
        run: ruff format --check backend/ agents/ ml/ data_engineering/

      - name: Type check with mypy
        run: mypy backend/ agents/ --ignore-missing-imports

  # ============================================================================
  # Unit Tests
  # ============================================================================
  test-unit:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run unit tests
        run: pytest backend/tests/unit agents/evals -m "unit" -v --cov=backend --cov=agents --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  # ============================================================================
  # Integration Tests
  # ============================================================================
  test-integration:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    needs: test-unit
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: factored
          POSTGRES_PASSWORD: factored2026
          POSTGRES_DB: bankingdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U factored -d bankingdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://factored:factored2026@localhost:5432/bankingdb
          REDIS_URL: redis://localhost:6379/0
        run: pytest backend/tests/integration -m "integration" -v

  # ============================================================================
  # dbt Tests
  # ============================================================================
  test-dbt:
    name: "dbt Tests"
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: factored
          POSTGRES_PASSWORD: factored2026
          POSTGRES_DB: bankingdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U factored -d bankingdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt
        run: pip install dbt-postgres

      - name: Run dbt tests
        working-directory: data_engineering/dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt deps
          dbt seed
          dbt run
          dbt test

  # ============================================================================
  # Agent Evaluations (CI suite - lightweight)
  # ============================================================================
  test-evals:
    name: "Agent Evaluations (CI)"
    runs-on: ubuntu-latest
    needs: test-unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run CI evaluation suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python agents/evals/evaluator.py --suite=ci

  # ============================================================================
  # Docker Build
  # ============================================================================
  docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false
          tags: factored-banking-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
