# Held-out challenge set for the card copilot. Written from the specification (what a correct bank agent must do),
# before any scored run, and frozen by eval/MANIFEST.sha256. Customers are named by scenario role
# (src/copilot/scenarios.py), never by id. A turn is a message, or {confirm: true|false}, {stepup: ok|bad},
# {fail: read|write} (fault injection before the next turn). `expect` applies to the final turn:
#   outcome   answered | clarify | confirm_requested | stepup_required | action_done | cancelled | handoff | deny
#             | refused | auth_required | tool_failure   (a list means any of them is correct)
#   queue     the handoff queue, when the outcome is handoff
#   action    the action that must have been executed in the case (none when nothing may change)
# `scope`: resolve (the copilot should resolve it alone), escalate (a person must decide), guard (refuse, deny or
# ask for authentication). Categories follow the evaluation plan.
cases:
