# Intent training phrasings, written by the team for the copilot (Spanish and Portuguese). Each line is one base
# phrasing; scripts/intent.py augments them (greetings, courtesy, accents dropped, casing) and keeps every variant in
# its base phrasing's group, so cross-validation never trains and scores on two variants of the same sentence.
# The two distinct customer openings in the dataset's call transcripts are included under source: transcripts.
# The held-out evaluation phrasings live in eval/intent_test.yaml and were written separately, before tuning.
transcripts:
  balance_limit: ["necesito consultar el saldo de mi tarjeta de crédito"]
  out_of_scope: ["quisiera saber cuál es mi saldo actual en mi cuenta de ahorros"]

intents:
  smalltalk:
    es: [hola, buenos días, buenas tardes, gracias, muchas gracias, "ok, gracias", perfecto, eso era todo, "adiós", "hasta luego", "listo, gracias por la ayuda", "qué tal", "buenas noches", "genial, gracias", "vale"]
    pt: [oi, olá, bom dia, boa tarde, obrigado, obrigada, muito obrigado, "ok, valeu", perfeito, era só isso, tchau, até logo, "beleza, obrigado pela ajuda", boa noite, "tudo bem?"]
