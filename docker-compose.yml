# ============================================================================
# Factored AI & Data Hackathon 2026
# AI-First Banking Customer Service System
# Docker Compose - Local Development Stack
# ============================================================================

services:
  # ==========================================================================
  # Core Application
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://factored:factored2026@postgres:5432/bankingdb
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=factored2026
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app/backend
      - ./agents:/app/agents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    profiles: [core, full]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - banking-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - api
    profiles: [core, full]
    networks:
      - banking-net

  # ==========================================================================
  # Databases
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=factored
      - POSTGRES_PASSWORD=factored2026
      - POSTGRES_DB=bankingdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factored -d bankingdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [core, full]
    networks:
      - banking-net

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/factored2026
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
    profiles: [core, full]
    networks:
      - banking-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles: [core, full]
    networks:
      - banking-net

  # ==========================================================================
  # ML & Experiment Tracking
  # ==========================================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    ports:
      - "5000:5000"
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql://factored:factored2026@postgres:5432/mlflowdb
        --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [core, full]
    networks:
      - banking-net

  model-server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ml-serving
    ports:
      - "8001:8001"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_REGISTRY_URI=http://mlflow:5000
    volumes:
      - ./ml:/app/ml
      - mlflow_artifacts:/mlflow/artifacts:ro
    depends_on:
      - mlflow
    profiles: [full]
    networks:
      - banking-net

  # ==========================================================================
  # Monitoring & Observability
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.54.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    profiles: [monitoring, full]
    networks:
      - banking-net

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=factored2026
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: [monitoring, full]
    networks:
      - banking-net

  # ==========================================================================
  # Data Engineering - Orchestration
  # ==========================================================================
  airflow-webserver:
    image: apache/airflow:2.10.2-python3.11
    ports:
      - "8080:8080"
    environment: &airflow-env
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://factored:factored2026@postgres:5432/airflowdb
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=false
    volumes:
      - ./data_engineering/orchestration/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [orchestration, full]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - banking-net

  airflow-scheduler:
    image: apache/airflow:2.10.2-python3.11
    environment: *airflow-env
    volumes:
      - ./data_engineering/orchestration/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    depends_on:
      - airflow-webserver
    profiles: [orchestration, full]
    networks:
      - banking-net

  # ==========================================================================
  # Streaming (Demo)
  # ==========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    profiles: [streaming, full]
    networks:
      - banking-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    profiles: [streaming, full]
    networks:
      - banking-net

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
  airflow_logs:

# ============================================================================
# Networks
# ============================================================================
networks:
  banking-net:
    driver: bridge
