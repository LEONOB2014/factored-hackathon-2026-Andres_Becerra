[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factored-hackathon-2026"
version = "0.1.0"
description = "AI-First Banking Customer Service System - Factored Datathon 2026"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andres Becerra" }]

dependencies = [
    # === Core ===
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "websockets>=13.0",

    # === Database ===
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.1.0",
    "neo4j>=5.25.0",

    # === LangChain / Agents ===
    "langgraph>=0.2.40",
    "langchain>=0.3.5",
    "langchain-openai>=0.2.5",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.5",
    "langchain-postgres>=0.0.12",
    "litellm>=1.50.0",
    "pgvector>=0.3.5",

    # === ML / Data Science ===
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "optuna>=4.0.0",
    "shap>=0.46.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=18.0.0",

    # === NLP ===
    "transformers>=4.45.0",
    "tokenizers>=0.20.0",
    "sentence-transformers>=3.2.0",
    "onnxruntime>=1.19.0",
    "onnx>=1.17.0",

    # === Data Engineering ===
    "great-expectations>=1.1.0",
    "pandera>=0.20.0",
    "dbt-postgres>=1.8.0",

    # === Monitoring & Tracking ===
    "mlflow>=2.17.0",
    "evidently>=0.4.40",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",

    # === Utilities ===
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.16.10",   # keep in sync with .pre-commit-config.yaml
    "mypy>=2.3.1",     # keep in sync with .pre-commit-config.yaml
    "pre-commit>=4.0.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "notebook>=7.2.0",
    "httpx>=0.27.0",  # for TestClient
]

spark = [
    "pyspark>=3.5.0",
    "delta-spark>=3.2.0",
]

streaming = [
    "confluent-kafka>=2.6.0",
    "kafka-python>=2.0.2",
]

[tool.setuptools.packages.find]
# Flat layout: without this, setuptools sees monitoring/ and infrastructure/
# as packages too and refuses to build ("Multiple top-level packages discovered").
include = ["agents*", "backend*", "data_engineering*", "ml*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "agents", "ml", "data_engineering", "eda/src", "eda/scripts", "eda/tests", "platform/libs", "platform/airflow/include"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "S101",  # assert usage OK in tests
    "B008",  # Depends() in FastAPI
]

[tool.ruff.lint.per-file-ignores]
# Exploratory notebooks and scripts: long DuckDB SQL, sys.path setup before
# imports, prints and math-style names (X, N) are normal there. The B rules
# are style or false positives here: lambdas in loops run in the same
# iteration, zip() inputs come from one row, `display` is IPython's.
"eda/**" = [
    "E402", "E501", "E731", "E741", "S112", "S603", "S608", "T201", "N803", "N806", "C408",
    "A004", "B007", "B018", "B023", "B905",
]

# --- data platform (managed) ---
# Platform code: long SQL in f-strings, CLI prints, typing-only imports kept at runtime.
"platform/**" = ["B905", "E501", "S608", "T201", "TC001", "TC002", "TC003"]
"platform/airflow/dags/landing_ingest.py" = ["S607"]  # runs the container's python on PATH
"platform/airflow/dags/ml_graph_learning.py" = ["E741"]
"platform/airflow/dags/publish_serving.py" = ["SIM117"]
"platform/dbt/scripts/mermaid_lineage.py" = ["B007"]
"platform/dbt/scripts/verify/corrections_e2e.py" = ["S603", "S607"]  # runs dbt and the sibling verify scripts
"platform/libs/latam_platform/audit_ledger.py" = ["S107"]  # the default is an environment variable name, not a password
"platform/libs/latam_platform/kb_pipeline.py" = ["DTZ011"]
"platform/libs/latam_platform/lakehouse/bronze.py" = ["SIM108"]
"platform/libs/latam_platform/ml/federated_gnn.py" = ["N812"]  # torch_geometric.utils imported as U by convention
"platform/libs/latam_platform/ml/tgn.py" = ["B007"]
"platform/libs/latam_platform/privacy.py" = ["N818"]  # public exception name kept for API stability
"platform/libs/latam_platform/stream.py" = ["PTH123", "SIM115"]
"platform/libs/tests/test_audit_and_genai.py" = ["S106"]  # test-only tokens
"platform/libs/tests/test_privacy.py" = ["SIM117"]
"platform/services/fraud_scorer/scorer.py" = ["S104"]  # the service binds 0.0.0.0 inside its container
# --- end data platform ---

[tool.ruff.lint.isort]
known-first-party = ["backend", "agents", "ml", "data_engineering", "latam_eda", "latam_platform", "latam_dags"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "agents/evals", "ml"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require Docker services)",
    "slow: Slow tests (model training, etc.)",
    "eval: Agent evaluation tests",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
