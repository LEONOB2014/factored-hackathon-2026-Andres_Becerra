[project]
name = "beta-aid-data-api"
version = "0.1.0"
description = "Read-only BETA AID Data API for serving metadata and the knowledge registry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../libs"]
markers = [
    "integration: requires pg-core on 127.0.0.1:5433 as app_reader",
]
