[project]
name = "latam-platform"
version = "0.1.0"
description = "Compliance-grade data platform: medallion lakehouse, Kimball core, audit and serving"
requires-python = ">=3.12"
dependencies = [
    "dbt-bigquery>=1.12.1",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs/latam_platform"]
