[project]
name = "latam-platform"
version = "0.1.0"
description = "Compliance-grade data platform: medallion lakehouse, Kimball core, audit and serving"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.107",
    "cryptography>=50.0.2",
    "dbt-bigquery>=1.12.1",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "neo4j>=6.3.1",
    "opendp>=0.15.1",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs/latam_platform"]

[tool.pytest.ini_options]
testpaths = ["libs/tests"]
