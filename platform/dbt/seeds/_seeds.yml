version: 2

seeds:
  - name: source_contract_columns
    description: >
      The reviewed source contracts (platform/contracts/sources/*.yml) as a table: header order, type,
      required flag, baselines for the drift checks. Generated by scripts/generate_silver_from_contracts.py.
    config:
      column_types: {scale_log10_median: double, scale_mad: double, empty_share: double}

  - name: dq_cell_rule_slo
    description: >
      Cell-level rules (codes in audit.dq_cell_findings) with severity and SLO. table_name '*' is the default
      for every source table; a row for a specific table overrides it (measured baselines).

  - name: seed_country_calendar
    description: >
      Calendar per bank market and day (holidays, paydays, month ends, bonus months) read by the day-grain
      aggregates. Generated from latam_eda.granularity.country_calendar by scripts/generate_aggregates.py.
    config:
      column_types: {local_date: date, holiday_name: varchar, days_since_payday: double}

  - name: seed_clock
    description: >
      The declared delivery-day clock (ADR-014) the day-grain aggregates place events on: UTC offset in hours.
      Generated by scripts/generate_aggregates.py.
