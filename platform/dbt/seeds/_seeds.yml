version: 2

seeds:
  - name: source_contract_columns
    description: >
      The reviewed source contracts (platform/contracts/sources/*.yml) as a table: header order, type,
      required flag, baselines for the drift checks. Generated by scripts/generate_silver_from_contracts.py.
    config:
      column_types: {scale_log10_median: double, scale_mad: double, empty_share: double}

  - name: dq_cell_rule_slo
    description: >
      Cell-level rules (codes in audit.dq_cell_findings) with severity and SLO. table_name '*' is the default
      for every source table; a row for a specific table overrides it (measured baselines).
