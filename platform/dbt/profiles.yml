# Local development profile. Run dbt from inside platform/dbt/:  cd platform/dbt && uv run dbt build
# Paths are relative to platform/dbt/. The DuckDB file lives under data/lake/ (git-ignored).
latam_bank:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('LATAM_DUCKDB_PATH', '../../data/lake/lakehouse.duckdb') }}"
      threads: 6
      settings:
        memory_limit: "10GB"
        preserve_insertion_order: false
