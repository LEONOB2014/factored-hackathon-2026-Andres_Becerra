version: 2

# Lossless bronze of record: every record of every landed file, every field as its original text, proven
# byte-exact against the landing manifest (`latam_platform.cli bronze-raw-build`, docs/platform/09 §B).
# Layout: <zone>/<table>/<partition>/part-0.parquet with lineage columns _source_file, _record_no,
# _record_sha256, _parse_status, _partition_date, _ingest_run_id and _ingested_at. Read in place; dbt never
# writes to bronze. Silver types it against the reviewed source contracts (platform/contracts/sources) in
# models/silver/typed; union_by_name keeps a file whose header gained or lost a column readable, and the
# schema-drift models report it. (The typed bronze these sources replace is archived read-only.)
sources:
  - name: bronze_raw
    description: "Main folder (data/), authoritative. Lossless bronze, read-only."
    meta:
      external_location: "read_parquet('{{ env_var('LATAM_LAKE_DIR', '../../data/lake') }}/bronze_raw/{name}/*/*.parquet', union_by_name = true, hive_partitioning = false)"
    tables:
      - name: customers
      - name: products
      - name: branches
      - name: service_agents
      - name: marketing_campaigns
      - name: transactions
      - name: call_center_interactions
      - name: call_transcripts
      - name: satisfaction_surveys
      - name: digital_events
      - name: complaints
      - name: campaign_sends
      - name: daily_exchange_rates

  - name: holdout_raw
    description: "Holdout zone: facts with process_date >= var('stream_cutoff'), lossless. Replayed as a stream in the demo."
    meta:
      external_location: "read_parquet('{{ env_var('LATAM_LAKE_DIR', '../../data/lake') }}/holdout_raw/{name}/*/*.parquet', union_by_name = true, hive_partitioning = false)"
    tables:
      - name: transactions
      - name: digital_events

  - name: quarantine_raw
    description: "Lossless copy of data_backup_20260831/: used only by audit reconciliation, never joined to main."
    meta:
      external_location: "read_parquet('{{ env_var('LATAM_LAKE_DIR', '../../data/lake') }}/quarantine/backup_20260831_raw/{name}/*/*.parquet', union_by_name = true, hive_partitioning = false)"
    tables:
      - name: customers
      - name: products
      - name: transactions
      - name: complaints
      - name: call_center_interactions

  - name: corrections
    description: >
      Append-only log of approved data corrections, reverts and partition releases (dq_correction_review DAG,
      latam_platform.dq_corrections): one read-only Parquet file per approved proposal. Silver overlays it on
      lossless bronze; `_genesis.parquet` keeps the folder readable before the first correction.
    meta:
      external_location: "read_parquet('{{ env_var('LATAM_LAKE_DIR', '../../data/lake') }}/corrections/applied/*.parquet', union_by_name = true)"
    tables:
      - name: applied
