version: 2

# Schema-drift circuit breaker (docs/platform/09 §C). Runs inside the silver layer, between the typed models
# and staging, because staging must know which partitions are held before it reads them.
models:
  - name: dq_partition_profile
    description: >
      Per bronze partition and source-contract column: absent, empty, cast failures, foreign formats, broken
      keys, new and variant vocabulary, placeholders and the log10 median magnitude. Computed from the raw text
      with the predicates the typed models use. Generated by scripts/generate_silver_from_contracts.py.
    data_tests:
      - unique_combination: {arguments: {columns: [zone, table_name, partition_date, column_name]}}

  - name: dq_partition_header
    description: >
      Header of every landed file (from the lossless-bronze proof manifests) against its source contract:
      missing and unknown columns, changed order.

  - name: dq_schema_drift
    description: >
      Every check a partition failed against its source contract, with the observed value and the threshold.
      Severity A holds the partition; severity B is reported only.
    columns:
      - name: severity
        data_tests:
          - accepted_values: {arguments: {values: [A, B]}}

  - name: dq_partition_holds
    description: >
      Partitions held by the circuit breaker (a severity-A drift check and no reviewed release). Staging
      excludes their rows; the dbt_lakehouse DAG raises the schema_drift_partition_held trigger for each new one.
    data_tests:
      - unique_combination: {arguments: {columns: [table_name, partition_date]}}

  - name: dq_corrections_active
    description: >
      Cell corrections in force: approved through the four-eyes flow (dq_correction_review), applied up to
      var('corrections_as_of') and not reverted. The typed models overlay them on lossless bronze.
    data_tests:
      - unique_combination: {arguments: {columns: [zone, table_name, source_file, record_no, column_name]}}

  - name: dq_partition_releases_active
    description: "Partitions released from a schema-drift hold through the four-eyes flow (correction log)."
