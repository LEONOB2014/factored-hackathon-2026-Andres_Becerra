version: 2

# Every mart declares its grain, consumers and what it must not be used for.
models:
  - name: mart_customer_360
    description: "One row per customer: profile, holdings, behaviour, service, risk and DQ context."
    config: {meta: {grain: customer_id, consumers: [agent_copilot, crm, credit, graphrag], not_for: "model training on past dates (current-state)"}}
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: mart_account_payment_inquiry
    description: "One row per product with balance, pending/declined detail and the last 20 transactions."
    config: {meta: {grain: product_id, consumers: [contact_center, chatbot, agent_copilot]}}
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: mart_card_support
    description: "One row per card with decline diagnostics and a rule-based next best action."
    config: {meta: {grain: product_id, consumers: [card_operations, agent_copilot]}}
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: next_best_action
        data_tests:
          - accepted_values:
              arguments:
                values: [FRAUD_REVIEW_AND_BLOCK, REISSUE_CARD, PROACTIVE_RENEWAL, VERIFY_CARD_DATA,
                         REVIEW_RISK_BLOCK, EXPLAIN_LIMIT_OR_OFFER_INCREASE_REVIEW, UNBLOCK_AFTER_STRONG_AUTH, NONE]

  - name: mart_transaction_disputes
    description: "One row per transaction/fee complaint with probabilistic link to the disputed transaction."
    config: {meta: {grain: complaint_id, consumers: [disputes_ops, regulatory_reporting, agent_copilot]}}
    columns:
      - name: complaint_id
        data_tests: [unique, not_null]
      - name: link_confidence
        data_tests:
          - accepted_values: {arguments: {values: [high, medium, low, none]}}

  - name: feat_credit_eligibility_pit
    description: "Customer x month-end credit features. *_pit columns are point-in-time safe; *_current are not."
    config: {meta: {grain: [customer_id, snapshot_date], consumers: [credit_models]}}
    data_tests:
      - unique_combination: {arguments: {columns: [customer_id, snapshot_date]}}

  - name: mart_credit_eligibility
    description: "Latest eligibility per customer with adverse-action reason codes (illustrative policy)."
    config: {meta: {grain: customer_id, consumers: [credit_ops, agent_copilot, customer_app]}}
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: feat_fraud_realtime_pit
    description: "Transaction-level point-in-time fraud features with out-of-time split. No fraud_score."
    config: {meta: {grain: transaction_id, consumers: [fraud_models, kumo_tabular, streaming_parity_tests]}}
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: split
        data_tests:
          - accepted_values: {arguments: {values: [train, valid, test]}}

  - name: mart_aml_customer_month
    description: "Customer-month AML indicators, robust peer deviations and typology hits."
    config: {meta: {grain: [customer_id, month_start], consumers: [aml_monitoring, investigators]}}
    data_tests:
      - unique_combination: {arguments: {columns: [customer_id, month_start]}}

  - name: mart_cx_journey
    description: "One row per contact with transcript, survey, repeat-contact and complaint-escalation labels."
    config: {meta: {grain: interaction_id, consumers: [cx_analytics, qa, escalation_model]}}
    columns:
      - name: interaction_id
        data_tests: [unique, not_null]

  - name: mart_campaign_compliance_uplift
    description: "One row per send with consent check, contact pressure and uplift-ready columns."
    config: {meta: {grain: send_id, consumers: [marketing_compliance, uplift_models]}}
    columns:
      - name: send_id
        data_tests: [unique, not_null]

  - name: mart_collections_early_warning
    description: "One row per loan/credit card with delinquency, repayment trend and an early-warning score."
    config: {meta: {grain: product_id, consumers: [collections, agent_copilot]}}
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: early_warning_score
        data_tests: [not_null]
