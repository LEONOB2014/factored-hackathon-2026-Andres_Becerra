- name: fct_customer_month
  description: |-
    Periodic snapshot, one row per customer and calendar month (UTC month, as int_customer_month_tx), dense: a month with no activity is a row of zeros, which every rolling window and every "inactive" label needs. It is the bank's relationship with the customer month by month, across every process: money (transactions), self-service (digital sessions), assisted service (contacts), dissatisfaction (complaints), marketing (campaign sends), voice (surveys) and holdings (products open in the month). All measures are additive counts or sums; rates are derived at query time as a ratio of sums. band_key points to dim_customer_band (the behaviour mini-dimension).

    **Contracts** (each one a dbt test that fails the build):
    - grain: `customer_id, month_start` unique together
    - reconcile: `n_tx` = count(*) from int_transactions_enriched (per month_start = cast(date_trunc('month', transaction_ts_utc) as date))
    - reconcile: `outflow_usd` = sum(outflow_usd) from int_customer_month_tx (per month_start = month_start)
    - reconcile: `contacts` = count(*) from fct_interaction (per month_start = cast(date_trunc('month', interaction_ts_utc) as date))
    - reconcile: `sessions` = count(customer_id) from fct_digital_session (per month_start = cast(date_trunc('month', session_start_utc) as date))
    - reconcile: `complaints_opened` = count(*) from fct_complaint (per month_start = cast(date_trunc('month', created_ts_utc) as date))
    - reconcile: `sends` = count(*) from fct_campaign_send (per month_start = cast(date_trunc('month', send_ts_utc) as date))
    - reconcile: `surveys` = count(*) from stg_satisfaction_surveys (per month_start = cast(date_trunc('month', survey_ts_utc) as date))
    - dense: customer_id from int_customer_profile x month_start from int_customer_month_tx

    Source: `eda/src/latam_eda/granularity_sql/fct_customer_month.sql` (series I, eda/notebooks/granularity); generated by `platform/dbt/scripts/generate_aggregates.py` (ADR-017).
