# Generated by scripts/generate_contracts.py from the built relations. Model descriptions live in the
# script, column descriptions in scripts/serving_columns.yml, types in the SQL. Do not edit.
version: 2
models:
- name: serving_account_inquiry
  description: Per-product inquiry answers (balance, pending, declines with decoded reasons; history in serving_recent_transactions).
  config:
    contract:
      enforced: true
    meta:
      grain: product_id
      publish_to: postgres.bank_serving
  columns:
  - name: product_id
    data_type: VARCHAR
    description: Product business key (joins `dim_product`).
    constraints:
    - type: not_null
    data_tests:
    - unique
  - name: customer_id
    data_type: VARCHAR
    description: '{{ doc(''col_customer_id'') }}'
  - name: country_code
    data_type: VARCHAR
    description: The customer's country (MX, CO or AR). It decides which residency region may serve the row (ADR-007, ADR-021).
  - name: product_type
    data_type: VARCHAR
    description: Product type from the product master.
  - name: product_family
    data_type: VARCHAR
    description: Product family derived in silver (credit_card, debit_card, loan, deposit, investment).
  - name: product_status
    data_type: VARCHAR
    description: Product status from the product master (for example Active or Blocked).
  - name: currency
    data_type: VARCHAR
    description: Currency label of the product as delivered by the source.
  - name: current_balance
    data_type: DOUBLE
    description: Balance in the product currency, as delivered.
  - name: balance_usd
    data_type: DOUBLE
    description: Balance converted to USD at the daily rate (`int_fx_usd`).
  - name: available_credit
    data_type: DOUBLE
    description: Credit limit minus current balance; credit cards only.
  - name: utilization
    data_type: DOUBLE
    description: Balance divided by the credit limit (credit products only).
  - name: days_past_due
    data_type: INTEGER
    description: Days past due (credit products only).
  - name: pending_count
    data_type: BIGINT
    description: Transactions on the product still in Pending status.
  - name: pending_amount
    data_type: DOUBLE
    description: Sum of the Pending amounts, in the transaction currency.
  - name: declined_30d
    data_type: BIGINT
    description: Declined transactions in the 30 days to the as-of date.
  - name: reversed_30d
    data_type: BIGINT
    description: Reversed transactions in the 30 days to the as-of date.
  - name: last_decline_reason
    data_type: VARCHAR
    description: Meaning of the latest decline's response code (`response_codes` reference).
  - name: last_decline_action
    data_type: VARCHAR
    description: Suggested action for the latest decline (`response_codes` reference).
  - name: last_deposit_ts
    data_type: TIMESTAMP
    description: Time (UTC) of the latest approved deposit.
  - name: last_payment_ts
    data_type: TIMESTAMP
    description: Time (UTC) of the latest approved payment.
  - name: last_payment_amount
    data_type: DOUBLE
    description: Amount of the latest approved payment, in the transaction currency.
  - name: declines_by_code_90d_json
    data_type: JSON
    description: Declines in the 90 days to the as-of date by response code, as a JSON map of code to count (`<missing>` when
      the source gave no code).
  - name: n_recent_transactions
    data_type: BIGINT
    description: Rows for the product in `serving_recent_transactions` (at most 20).
  - name: as_of_ts
    data_type: TIMESTAMP
    description: 'End of the day the row describes: `var(''as_of_date'')` 23:59:59 (2026-05-17, the last day before the stream
      cutoff). Every window (30, 90, 365 days) ends here.'
- name: serving_card_support
  description: Per-card diagnostics and rule-based next best action.
  config:
    contract:
      enforced: true
    meta:
      grain: product_id
      publish_to: postgres.bank_serving
  columns:
  - name: product_id
    data_type: VARCHAR
    description: Product business key (joins `dim_product`).
    constraints:
    - type: not_null
    data_tests:
    - unique
  - name: customer_id
    data_type: VARCHAR
    description: '{{ doc(''col_customer_id'') }}'
  - name: country_code
    data_type: VARCHAR
    description: The customer's country (MX, CO or AR). It decides which residency region may serve the row (ADR-007, ADR-021).
  - name: product_type
    data_type: VARCHAR
    description: Product type from the product master.
  - name: product_status
    data_type: VARCHAR
    description: Product status from the product master (for example Active or Blocked).
  - name: is_blocked
    data_type: BOOLEAN
    description: TRUE when the card's status is Blocked.
  - name: expiration_date
    data_type: DATE
    description: Card or product expiration date.
  - name: days_to_expiry
    data_type: BIGINT
    description: Days from the as-of date to the expiration date (negative once expired).
  - name: is_active_but_expired
    data_type: BOOLEAN
    description: An active card past its expiration date (rule R22). It triggers REISSUE_CARD.
  - name: credit_limit
    data_type: DOUBLE
    description: Credit limit in the product currency (credit products only).
  - name: current_balance
    data_type: DOUBLE
    description: Balance in the product currency, as delivered.
  - name: utilization
    data_type: DOUBLE
    description: Balance divided by the credit limit (credit products only).
  - name: current_decline_streak
    data_type: BIGINT
    description: Declines since the card's last approved transaction, i.e. what the customer is living now.
  - name: declines_do_not_honor_30d
    data_type: BIGINT
    description: Declines with response code 05 (do not honor) in the last 30 days.
  - name: declines_invalid_card_30d
    data_type: BIGINT
    description: Declines with response code 14 (invalid card) in the last 30 days.
  - name: declines_insufficient_funds_30d
    data_type: BIGINT
    description: Declines with response code 51 (insufficient funds) in the last 30 days.
  - name: declines_expired_30d
    data_type: BIGINT
    description: Declines with response code 54 (expired card) in the last 30 days.
  - name: foreign_tx_90d
    data_type: BIGINT
    description: Cross-border transactions in the last 90 days.
  - name: foreign_countries_90d
    data_type: VARCHAR
    description: Countries of those cross-border transactions, comma-separated.
  - name: open_cases
    data_type: BIGINT
    description: '{{ doc(''col_card_open_cases'') }}'
  - name: contacts_30d
    data_type: BIGINT
    description: Contact-centre interactions in the last 30 days that mention this card.
  - name: next_best_action
    data_type: VARCHAR
    description: '{{ doc(''col_next_best_action'') }}'
  - name: as_of_ts
    data_type: TIMESTAMP
    description: 'End of the day the row describes: `var(''as_of_date'')` 23:59:59 (2026-05-17, the last day before the stream
      cutoff). Every window (30, 90, 365 days) ends here.'
- name: serving_credit_eligibility
  description: Latest eligibility with adverse-action reason codes (illustrative policy).
  config:
    contract:
      enforced: true
    meta:
      grain: customer_id
      publish_to: postgres.bank_serving
  columns:
  - name: customer_id
    data_type: VARCHAR
    description: '{{ doc(''col_customer_id'') }}'
    constraints:
    - type: not_null
    data_tests:
    - unique
  - name: snapshot_date
    data_type: DATE
    description: Date of the latest point-in-time feature snapshot the decision uses.
  - name: credit_score_current
    data_type: INTEGER
    description: Credit score at the snapshot.
  - name: eligible_credit_card
    data_type: BOOLEAN
    description: No adverse-action reason, a score at or above the card cut-off, and no credit card held.
  - name: eligible_personal_loan
    data_type: BOOLEAN
    description: No adverse-action reason and a score at or above the loan cut-off.
  - name: decline_reasons
    data_type: VARCHAR
    description: Adverse-action reason codes, comma-separated (empty when there are none).
  - name: score_reason
    data_type: VARCHAR
    description: '{{ doc(''col_score_reason'') }}'
  - name: as_of_ts
    data_type: TIMESTAMP
    description: 'End of the day the row describes: `var(''as_of_date'')` 23:59:59 (2026-05-17, the last day before the stream
      cutoff). Every window (30, 90, 365 days) ends here.'
