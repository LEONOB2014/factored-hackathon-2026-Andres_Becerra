    description: '{{ doc(''col_customer_id'') }}'
    constraints:
    - type: not_null
    data_tests:
    - unique
  - name: document_token
    data_type: VARCHAR
    description: Token of the identity document; the document itself stays in silver.
  - name: country_code
    data_type: VARCHAR
    description: The customer's country (MX, CO or AR). It decides which residency region may serve the row (ADR-007, ADR-021).
  - name: segment
    data_type: VARCHAR
    description: Commercial segment of the customer.
  - name: customer_status
    data_type: VARCHAR
    description: Customer status from the customer master.
  - name: tenure_days
    data_type: BIGINT
    description: Days from registration to the as-of date.
  - name: credit_score
    data_type: INTEGER
    description: Current credit score.
  - name: monthly_income_usd
    data_type: DOUBLE
    description: Declared monthly income converted to USD.
  - name: accepts_marketing
    data_type: BOOLEAN
    description: Current marketing consent.
  - name: n_products
    data_type: BIGINT
    description: Products held.
  - name: n_active_products
    data_type: BIGINT
    description: Products in Active status.
  - name: product_types
    data_type: VARCHAR
    description: Distinct product types held, comma-separated.
  - name: deposits_usd
