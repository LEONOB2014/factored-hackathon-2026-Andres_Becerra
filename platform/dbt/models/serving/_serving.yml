    description: Complaints filed in the last 365 days.
  - name: sla_breaches_365d
    data_type: BIGINT
    description: Complaints of the last 365 days whose SLA was breached (as delivered by the source).
  - name: last_nps_score
    data_type: BIGINT
    description: Score of the latest NPS survey.
  - name: last_csat_score
    data_type: BIGINT
    description: Score of the latest CSAT survey.
  - name: as_of_ts
    data_type: TIMESTAMP
    description: 'End of the day the row describes: `var(''as_of_date'')` 23:59:59 (2026-05-17, the last day before the stream
      cutoff). Every window (30, 90, 365 days) ends here.'
- name: serving_dispute_case
  description: Per-dispute case view with SLA clocks and probabilistic transaction link with evidence.
  config:
    contract:
      enforced: true
    meta:
      grain: complaint_id
      publish_to: postgres.bank_serving
  columns:
  - name: complaint_id
    data_type: VARCHAR
    description: Complaint business key. Disputes are complaints in the Transactions or Fees categories, or with subcategory
      "Cargo no reconocido" or "Cobro indebido".
    constraints:
    - type: not_null
    data_tests:
    - unique
  - name: customer_id
    data_type: VARCHAR
    description: '{{ doc(''col_customer_id'') }}'
  - name: country_code
    data_type: VARCHAR
    description: The customer's country (MX, CO or AR). It decides which residency region may serve the row (ADR-007, ADR-021).
  - name: case_type
    data_type: VARCHAR
    description: Case type from the complaint.
  - name: category
    data_type: VARCHAR
    description: Complaint category.
  - name: subcategory
    data_type: VARCHAR
    description: Complaint subcategory.
  - name: reception_channel
    data_type: VARCHAR
    description: Channel the complaint arrived through.
  - name: came_via_regulator
    data_type: BOOLEAN
    description: TRUE when the reception channel is Regulator.
  - name: priority
    data_type: VARCHAR
    description: Case priority.
  - name: status
    data_type: VARCHAR
    description: Case status.
  - name: is_closed
    data_type: BOOLEAN
    description: TRUE when the case is closed.
  - name: claimed_amount
    data_type: DOUBLE
    description: Amount the customer claims, in the claimed currency.
  - name: claimed_currency
    data_type: VARCHAR
    description: Currency of the claimed amount.
  - name: created_ts_utc
    data_type: TIMESTAMP
    description: '{{ doc(''col_ts_utc'') }}'
  - name: hours_to_assignment
    data_type: BIGINT
    description: Hours from creation to assignment.
  - name: hours_to_first_response
    data_type: BIGINT
    description: Hours from creation to the first response.
  - name: hours_open_or_to_resolution
    data_type: BIGINT
    description: Hours from creation to resolution, or to the as-of date while still open.
  - name: sla_breached
    data_type: BOOLEAN
    description: SLA breach flag as delivered by the source (rule R13 flags breaches resolved within 5 days).
  - name: prior_disputes_365d
    data_type: BIGINT
    description: The customer's other disputes in the 365 days before this one.
  - name: linked_transaction_id
    data_type: VARCHAR
    description: '{{ doc(''col_linked_transaction_id'') }}'
  - name: link_confidence
    data_type: VARCHAR
    description: '{{ doc(''col_link_confidence'') }}'
  - name: evidence_transaction_json
    data_type: JSON
    description: 'The linked transaction as JSON evidence: time, amount, currency, USD amount, merchant, channel, country,
      status and the fraud label.'
  - name: as_of_ts
    data_type: TIMESTAMP
    description: 'End of the day the row describes: `var(''as_of_date'')` 23:59:59 (2026-05-17, the last day before the stream
      cutoff). Every window (30, 90, 365 days) ends here.'
- name: serving_online_fraud_state
  description: Per-customer warm-start state for the streaming fraud scorer as of the stream cutoff.
  config:
    contract:
      enforced: true
    meta:
      grain: customer_id
      publish_to: postgres.bank_serving
  columns:
  - name: customer_id
    data_type: VARCHAR
    description: '{{ doc(''col_customer_id'') }}'
    constraints:
    - type: not_null
    data_tests:
    - unique
  - name: hist_tx_count
    data_type: BIGINT
    description: Transactions before the stream cutoff.
  - name: hist_mean_log_amount
    data_type: DOUBLE
    description: Mean of ln(1 + amount_usd) over the history (exact, order-independent aggregation).
  - name: hist_std_log_amount
    data_type: DOUBLE
    description: Standard deviation of ln(1 + amount_usd) over the history.
  - name: hist_sum_log_amount
    data_type: DOUBLE
    description: Sum of ln(1 + amount_usd); the stream updates it incrementally.
  - name: hist_sumsq_log_amount
    data_type: DOUBLE
    description: Sum of squares of ln(1 + amount_usd); with the sum and count it rebuilds the variance.
  - name: hist_max_amount_usd
    data_type: DOUBLE
    description: Largest USD amount in the history.
  - name: hist_sum_hour
    data_type: HUGEINT
    description: Sum of local transaction hours; divided by the count it gives the usual hour.
  - name: seen_merchants_json
    data_type: JSON
    description: Distinct merchants seen, as a sorted JSON list.
  - name: seen_countries_json
    data_type: JSON
    description: Distinct transaction countries seen, as a sorted JSON list.
  - name: seen_channels_json
    data_type: JSON
    description: Distinct channels seen, as a sorted JSON list.
  - name: last_tx_ts
    data_type: TIMESTAMP
    description: Time (UTC) of the latest transaction.
  - name: last_lat
    data_type: DOUBLE
    description: Latitude of the latest transaction.
  - name: last_lon
    data_type: DOUBLE
    description: Longitude of the latest transaction.
  - name: state_as_of_ts
    data_type: TIMESTAMP
    description: The stream cutoff (`var('stream_cutoff')`, 2026-05-18). The scorer starts from this state so the first streamed
      transaction sees the same history as the batch features.
- name: serving_recent_transactions
  description: Last 20 transactions per product for inquiry answers (rank 1 = latest).
  config:
    contract:
      enforced: true
    meta:
      grain:
      - product_id
      - recency_rank
      publish_to: postgres.bank_serving
  columns:
  - name: product_id
    data_type: VARCHAR
    description: Product business key (joins `dim_product`).
    constraints:
    - type: not_null
  - name: recency_rank
    data_type: BIGINT
    description: Position among the product's latest transactions (1 = latest; at most 20).
  - name: transaction_id
    data_type: VARCHAR
    description: Transaction business key.
  - name: transaction_ts_local
    data_type: TIMESTAMP
    description: Transaction time on the local clock.
  - name: transaction_type
    data_type: VARCHAR
    description: Transaction type (for example Purchase, Payment or Deposit).
  - name: amount
    data_type: DOUBLE
    description: Amount in the transaction currency.
  - name: currency
    data_type: VARCHAR
    description: Currency label of the product as delivered by the source.
  - name: transaction_status
    data_type: VARCHAR
    description: Status (Approved, Declined, Pending or Reversed).
  - name: decline_or_status_reason
    data_type: VARCHAR
    description: Meaning of the response code (`response_codes` reference).
  - name: merchant_name
    data_type: VARCHAR
    description: Merchant name as delivered (NULL for non-merchant transactions).
  - name: channel
    data_type: VARCHAR
    description: Channel of the transaction.
  - name: transaction_country_code
    data_type: VARCHAR
    description: Country where the transaction took place.
  - name: as_of_ts
    data_type: TIMESTAMP
    description: 'End of the day the row describes: `var(''as_of_date'')` 23:59:59 (2026-05-17, the last day before the stream
      cutoff). Every window (30, 90, 365 days) ends here.'
